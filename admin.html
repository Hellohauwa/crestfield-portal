<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Portal — Crestfield College</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    .field{width:100%;height:46px;padding:0 12px;border:1.5px solid #CBD5E1;border-radius:10px;font:15px Inter,sans-serif;color:#0F172A;background:#fff}
    textarea.field{height:auto;padding:12px;line-height:1.5;resize:vertical}
    .field:focus{outline:3px solid #BFDBFE;border-color:#1E3A8A}
    .tnum{font-variant-numeric:tabular-nums}
    .lbl{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
  </style>
</head>
<body class="bg-page font-sans text-ink antialiased">

<div id="boot" class="min-h-screen flex flex-col items-center justify-center gap-4 text-slate-600">
  <span data-crest="48"></span><p class="text-sm font-medium">Loading the admin portal…</p>
</div>

<div id="app" class="hidden min-h-screen lg:flex">
  <aside class="hidden lg:flex w-[248px] flex-none bg-navy text-white px-4 py-6 flex-col gap-7 sticky top-0 h-screen overflow-y-auto">
    <div class="flex items-center gap-2.5 px-2">
      <span data-crest="34"></span>
      <div><div class="font-display font-extrabold text-[17px]">Crestfield College</div><span class="inline-block mt-0.5 px-2 py-0.5 rounded-full bg-white text-navy text-[11px] font-bold">Admin Portal</span></div>
    </div>
    <nav aria-label="Main" id="side-nav" class="flex flex-col gap-1"></nav>
    <div class="mt-auto border-t border-white/15 pt-4 px-2 flex items-center gap-2.5">
      <div class="flex-none w-10 h-10 rounded-full bg-white text-navy flex items-center justify-center font-bold text-[15px]" data-bind="initials"></div>
      <div class="flex-1 min-w-0"><div class="font-semibold text-sm truncate" data-bind="name"></div><div class="text-xs text-indigo-200">Admin</div></div>
      <button type="button" data-action="logout" aria-label="Log out" title="Log out" class="flex items-center justify-center w-11 h-11 rounded-[10px] text-slate-300 hover:bg-white/10 hover:text-white">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>
      </button>
    </div>
  </aside>

  <div class="flex-1 min-w-0 flex flex-col">
    <header class="lg:hidden sticky top-0 z-20 bg-white border-b border-slate-200 px-4 py-3 flex items-center gap-2.5">
      <span data-crest="28"></span>
      <div class="flex-1 min-w-0"><h1 id="m-title" class="font-display font-bold text-lg leading-tight"></h1><div id="m-sub" class="text-xs text-slate-600"></div></div>
      <button type="button" data-action="logout" aria-label="Log out" class="w-11 h-11 rounded-full bg-navy text-white flex items-center justify-center font-bold text-[15px]" data-bind="initials"></button>
    </header>
    <div id="more-tabs" class="lg:hidden hidden bg-white border-b border-slate-200 px-1 grid grid-cols-3"></div>
    <main id="view" class="flex-1 w-full max-w-[1120px] p-4 lg:px-10 lg:py-8 pb-28 lg:pb-8"></main>
  </div>

  <nav aria-label="Main" id="bottom-nav" class="lg:hidden fixed bottom-0 inset-x-0 z-20 bg-white border-t border-slate-200 px-1 pt-1.5 pb-3.5 grid grid-cols-5 shadow-[0_-4px_12px_rgba(15,23,42,0.05)]"></nav>
</div>

<script>
const ICON = {
  dashboard: 'M3 10.5L12 3l9 7.5M5 9v11h5v-6h4v6h5V9',
  students: 'M22 10L12 5 2 10l10 5 10-5zM6 12v5c3 2 9 2 12 0v-5',
  teachers: 'M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM17 11l2 2 4-4',
  classes: 'M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2zM4 21V5M8 7h7',
  fees: 'M3 7h15a3 3 0 013 3v7a3 3 0 01-3 3H3zM3 7V5a2 2 0 012-2h11M17 14h.01',
  announcements: 'M3 11v2a1 1 0 001 1h3l7 4V6L7 10H4a1 1 0 00-1 1zM18 9a3 3 0 010 6',
  more: 'M4 6h16M4 12h16M4 18h16', info: 'M12 8v5M12 16h.01M12 21a9 9 0 110-18 9 9 0 010 18z',
  search: 'M11 18a7 7 0 100-14 7 7 0 000 14zM21 21l-4.3-4.3', close: 'M6 6l12 12M18 6L6 18', promote: 'M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM19 8v6M22 11h-6',
  invites: 'M3 6h18v12H3zM3 7l9 6 9-6'
};
const icon = (n, s, extra) => '<svg width="' + (s || 20) + '" height="' + (s || 20) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ' + (extra || '') + '><path d="' + ICON[n] + '"/></svg>';
const VIEWS = { dashboard: 'Dashboard', students: 'Students', teachers: 'Teachers', invites: 'Invite Teachers', classes: 'Classes & Subjects', fees: 'Fees', announcements: 'Announcements' };
const BOTTOM = [['dashboard', 'Home', 'dashboard'], ['students', 'Students', 'students'], ['fees', 'Fees', 'fees'], ['announcements', 'Notices', 'announcements'], ['teachers', 'More', 'more']];
const card = 'bg-white border border-slate-200 rounded-2xl shadow-card';
const btnPrimary = 'min-h-[46px] px-5 rounded-xl bg-navy text-white font-semibold text-[15px] disabled:opacity-60';
const btnGhost = 'min-h-[46px] px-4 rounded-xl border border-slate-300 bg-white text-slate-700 font-semibold text-[15px]';
const btnSmall = 'min-h-[38px] lg:min-h-[36px] px-3 rounded-[9px] border border-slate-300 bg-white text-navy font-semibold text-[13px]';
const btnDanger = 'min-h-[38px] lg:min-h-[36px] px-3 rounded-[9px] border border-red-200 bg-white text-red-700 font-semibold text-[13px]';

const state = {
  user: null, me: null, error: null,
  roles: {}, profiles: [], classes: [], subjects: [], fees: [], announcements: [], assignments: [],
  ui: {
    s: { q: '', cls: 'all', edit: null },
    t: { sel: null, email: '', cls: '', subj: [] },
    cs: { editKind: null, editId: null, editVal: '', newClass: '', newSubject: '' },
    f: { q: '', cls: 'all', owing: false, sel: null, mode: null, amount: '', bulk: '' },
    n: { editId: null, title: '', body: '', confirm: null },
    i: { name: '', email: '', cls: '', subj: [], list: null, loading: false, confirm: null },
    busy: false
  }
};

/* ---------- Data ---------- */
async function loadAll() {
  state.error = null;
  const q = await Promise.all([
    sb.from('user_roles').select('user_id, role'),
    sb.from('profiles').select('id, full_name, email, admission_number, parent_phone, class_id').order('full_name'),
    sb.from('classes').select('id, name').order('name'),
    sb.from('subjects').select('id, name').order('name'),
    sb.from('fees').select('id, student_id, term, session, amount_due, amount_paid').eq('term', SCHOOL.currentTerm).eq('session', SCHOOL.currentSession),
    sb.from('announcements').select('id, title, body, created_at').order('created_at', { ascending: false }),
    sb.from('teacher_assignments').select('id, teacher_id, class_id, subject_id')
  ]);
  const bad = q.find((x) => x.error);
  if (bad) { state.error = bad.error.message; return; }
  state.roles = {}; q[0].data.forEach((r) => { state.roles[r.user_id] = r.role; });
  [state.profiles, state.classes, state.subjects, state.fees, state.announcements, state.assignments] = q.slice(1).map((x) => x.data || []);
  state.me = state.profiles.find((p) => p.id === state.user.id) || null;
}
const roleOf = (id) => state.roles[id] || 'student';
const students = () => state.profiles.filter((p) => roleOf(p.id) === 'student');
const teachers = () => state.profiles.filter((p) => roleOf(p.id) === 'teacher');
const className = (id) => { const c = state.classes.find((x) => x.id === id); return c ? c.name : ''; };
const subjectName = (id) => { const s = state.subjects.find((x) => x.id === id); return s ? s.name : ''; };
const feeOf = (sid) => state.fees.find((f) => f.student_id === sid) || null;
const naira = (n) => formatNaira(n);
const termPill = () => '<span class="px-3.5 py-2 rounded-full text-sm font-semibold bg-white border border-slate-200 text-navy">' + TERM_NAMES[SCHOOL.currentTerm] + ' · ' + SCHOOL.currentSession + '</span>';

/* ---------- Shared pieces ---------- */
function pageHeader(title, sub, right) {
  return '<div class="hidden lg:flex flex-wrap gap-3 items-center justify-between mb-6"><div><h1 class="font-display font-bold text-[28px]">' + title + '</h1><div class="text-sm text-slate-600 mt-0.5">' + sub + '</div></div>' + (right || '') + '</div>';
}
function errorBox() {
  return '<div class="bg-white border border-red-200 rounded-2xl px-6 py-10 text-center"><h2 class="font-display font-bold text-lg mb-1.5">Something went wrong.</h2><p class="text-sm text-slate-600 mb-5">' + escapeHtml(state.error) + '</p><button type="button" data-action="retry" class="' + btnPrimary + '">Try again</button></div>';
}
const searchBox = (key, val, ph) => '<label class="relative block flex-[2_1_240px]"><span class="absolute left-3 top-3 text-slate-500">' + icon('search', 20) + '</span><input type="search" data-input="' + key + '" value="' + escapeHtml(val) + '" placeholder="' + ph + '" aria-label="' + ph + '" class="field" style="padding-left:40px;height:44px"></label>';
const classSelect = (key, val, extra) => '<select data-change="' + key + '" aria-label="Filter by class" class="field flex-[1_1_160px]" style="height:44px">' + (extra || '') + state.classes.map((c) => '<option value="' + c.id + '"' + (c.id === val ? ' selected' : '') + '>' + escapeHtml(c.name) + '</option>').join('') + '</select>';
// Panel: side panel on desktop, bottom sheet on phone
function panel(inner, closeAction) {
  return '<div class="fixed inset-0 z-30 bg-ink/45 lg:hidden" data-action="' + closeAction + '"></div>' +
    '<section class="fixed inset-x-0 bottom-0 z-40 max-h-[85vh] overflow-y-auto rounded-t-[22px] lg:rounded-2xl lg:static lg:z-auto lg:max-h-none lg:overflow-visible lg:flex-1 lg:basis-[320px] lg:min-w-0 bg-white lg:border-[1.5px] lg:border-navy p-5 pb-8 lg:p-[22px] shadow-[0_-12px_32px_rgba(15,23,42,0.2)] lg:shadow-lift" role="dialog">' +
    '<div class="lg:hidden w-10 h-[5px] rounded-full bg-slate-300 mx-auto mb-3"></div>' + inner + '</section>';
}
const closeBtn = (action) => '<button type="button" data-action="' + action + '" aria-label="Close" class="flex-none w-11 h-11 lg:w-9 lg:h-9 rounded-[10px] bg-slate-100 text-slate-600 flex items-center justify-center">' + icon('close', 16) + '</button>';

/* ---------- Dashboard ---------- */
function viewDashboard() {
  const name = (state.me && state.me.full_name) || state.user.email;
  let html = pageHeader('Dashboard', 'Welcome, ' + escapeHtml(name) + ' · ' + escapeHtml(formatDate(new Date(), { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })), termPill());
  if (state.error) return html + errorBox();
  const studs = students(), noClass = studs.filter((s) => !s.class_id).length;
  let due = 0, paid = 0, outstanding = 0, owing = 0;
  studs.forEach((s) => { const f = feeOf(s.id); if (!f) return; due += f.amount_due; paid += f.amount_paid; const b = f.amount_due - f.amount_paid; if (b > 0) { outstanding += b; owing++; } });
  const noFee = studs.filter((s) => !feeOf(s.id)).length;
  const pct = due ? Math.round(paid / due * 100) : 0;
  const stat = (href, label, value, note, iconName, bg) => '<a href="' + href + '" class="' + card + ' p-4 lg:p-5 text-ink flex gap-4 items-center hover:border-navy/30"><span class="hidden lg:flex flex-none w-[52px] h-[52px] rounded-[14px] items-center justify-center ' + bg + '">' + icon(iconName, 26) + '</span><div><div class="text-[13px] lg:text-sm text-slate-600 font-medium">' + label + '</div><div class="font-display font-extrabold text-2xl lg:text-[32px] leading-tight">' + value + '</div><div class="text-xs lg:text-[13px] font-semibold ' + (note.cls || 'text-slate-600') + '">' + note.t + '</div></div></a>';
  html += '<section class="grid grid-cols-3 gap-2 lg:gap-4 mb-4 lg:mb-6">' +
    stat('#students', 'Students', studs.length, noClass ? { t: noClass + ' need a class', cls: 'text-amber-800' } : { t: 'All in a class' }, 'students', 'bg-navy-soft text-navy') +
    stat('#teachers', 'Teachers', teachers().length, { t: state.assignments.length + ' assignments' }, 'teachers', 'bg-green-100 text-green-700') +
    stat('#classes', 'Classes', state.classes.length, { t: state.subjects.length + ' subjects' }, 'classes', 'bg-gold-soft text-gold-ink') + '</section>';
  html += '<section class="bg-navy text-white rounded-[20px] p-5 lg:px-[30px] lg:py-[26px] shadow-navy mb-4 lg:mb-6">' +
    '<div class="flex flex-wrap justify-between items-center gap-3 mb-4"><h2 class="font-display font-bold text-lg lg:text-xl">Fees this term</h2><a href="#fees" class="inline-flex items-center min-h-[40px] px-4 rounded-[10px] bg-gold text-ink font-semibold text-sm">Record a payment</a></div>' +
    '<div class="grid grid-cols-2 lg:grid-cols-3 gap-4 mb-4"><div><div class="text-[13px] lg:text-sm text-indigo-200">Collected</div><div class="font-display font-extrabold text-2xl lg:text-[32px]">' + naira(paid) + '</div></div><div><div class="text-[13px] lg:text-sm text-indigo-200">Outstanding</div><div class="font-display font-extrabold text-2xl lg:text-[32px] text-gold-light">' + naira(outstanding) + '</div></div><div class="col-span-2 lg:col-span-1"><div class="text-[13px] lg:text-sm text-indigo-200">Total due</div><div class="font-display font-extrabold text-2xl lg:text-[32px]">' + naira(due) + '</div></div></div>' +
    '<div class="h-3 rounded-full bg-white/20"><div class="h-3 rounded-full bg-gold" style="width:' + pct + '%"></div></div>' +
    '<div class="flex flex-wrap justify-between gap-2 mt-2 text-[13px] text-indigo-200"><span>' + pct + '% collected</span><span>' + owing + ' owing' + (noFee ? ' · ' + noFee + ' with no fee set' : '') + '</span></div></section>';
  const latest = state.announcements.slice(0, 3);
  html += '<section class="' + card + ' px-4 lg:px-6 pt-1 lg:pt-2 pb-3"><div class="flex justify-between items-center"><h2 class="font-display font-bold text-[17px] lg:text-lg">Latest announcements</h2><a href="#announcements" class="inline-flex items-center min-h-[48px] text-sm font-semibold text-navy">Manage</a></div>' +
    (latest.length ? latest.map((n) => '<div class="py-3 border-t border-slate-100"><div class="text-xs font-semibold text-slate-600 mb-0.5">' + formatDate(n.created_at) + '</div><div class="font-semibold text-[15px]">' + escapeHtml(n.title) + '</div></div>').join('') : '<p class="py-4 border-t border-slate-100 text-sm text-slate-600">No announcements yet.</p>') + '</section>';
  return html;
}

/* ---------- Students ---------- */
function viewStudents() {
  const u = state.ui.s;
  const all = students();
  let html = pageHeader('Students', all.length + ' students · students create their own accounts at sign-up', '');
  if (state.error) return html + errorBox();
  const q = u.q.toLowerCase();
  const list = all.filter((s) => (u.cls === 'all' || (u.cls === 'none' ? !s.class_id : s.class_id === u.cls)) && (!q || s.full_name.toLowerCase().includes(q) || (s.admission_number || '').toLowerCase().includes(q) || (s.email || '').toLowerCase().includes(q)));
  html += '<div class="flex flex-wrap gap-2.5 lg:gap-3 mb-3 lg:mb-5">' + searchBox('s-q', u.q, 'Search name, email or admission number') + classSelect('s-cls', u.cls, '<option value="all">All classes</option><option value="none"' + (u.cls === 'none' ? ' selected' : '') + '>Needs a class</option>') + '</div>';
  const cols = 'lg:grid lg:grid-cols-[minmax(0,2.2fr)_minmax(0,1fr)_minmax(0,1.2fr)_80px]';
  let table = '<section class="' + card + ' overflow-hidden lg:flex-[999_1_520px] min-w-0">';
  if (!all.length) table += '<p class="px-6 py-10 text-center text-sm text-slate-600">No students have signed up yet.</p>';
  else if (!list.length) table += '<p class="px-6 py-10 text-center text-sm text-slate-600">No students match your search.</p>';
  else table += '<div class="hidden ' + cols + ' bg-page text-slate-600 text-[13px] font-semibold"><div class="px-5 py-3">Student</div><div class="px-2 py-3">Class</div><div class="px-2 py-3">Parent phone</div><div class="px-5 py-3"></div></div>' +
    list.map((s) => '<div class="border-t border-slate-100 flex ' + cols.replace('lg:grid ', 'lg:grid ') + ' items-center gap-2.5 px-3.5 lg:px-0 py-2.5 lg:py-0 ' + (u.edit && u.edit.id === s.id ? 'bg-[#F5F7FF]' : '') + '">' +
      '<div class="flex-1 min-w-0 lg:px-5 lg:py-2.5"><div class="font-semibold text-[15px] truncate">' + escapeHtml(s.full_name) + '</div><div class="text-xs text-slate-600 truncate">' + escapeHtml(s.admission_number || 'No admission number') + ' · ' + escapeHtml(s.email || '') + '</div><div class="lg:hidden mt-1"><span class="px-2 py-0.5 rounded-full text-xs font-semibold ' + (s.class_id ? 'bg-navy-tint text-navy' : 'bg-amber-100 text-amber-800') + '">' + (s.class_id ? escapeHtml(className(s.class_id)) : 'Needs a class') + '</span></div></div>' +
      '<div class="hidden lg:block px-2"><span class="px-2.5 py-1 rounded-full text-[13px] font-semibold ' + (s.class_id ? 'bg-navy-tint text-navy' : 'bg-amber-100 text-amber-800') + '">' + (s.class_id ? escapeHtml(className(s.class_id)) : 'Needs a class') + '</span></div>' +
      '<div class="hidden lg:block px-2 text-sm text-slate-700">' + escapeHtml(s.parent_phone || '—') + '</div>' +
      '<div class="flex-none lg:px-5 text-right"><button type="button" data-action="s-edit" data-id="' + s.id + '" class="' + btnSmall + ' min-h-[44px]">Edit</button></div></div>').join('');
  table += '</section>';
  let side = '';
  if (u.edit) {
    const e = u.edit;
    side = panel('<div class="flex justify-between items-start gap-3 mb-4"><div><div class="text-[13px] text-slate-600 font-semibold">Edit student</div><h2 class="font-display font-bold text-xl mt-0.5">' + escapeHtml(e.full_name) + '</h2><div class="text-[13px] text-slate-600 break-all">' + escapeHtml(e.email || '') + '</div></div>' + closeBtn('s-close') + '</div>' +
      '<label class="lbl" for="e-class">Class</label><select id="e-class" data-edit="class_id" class="field mb-3.5"><option value="">No class</option>' + state.classes.map((c) => '<option value="' + c.id + '"' + (c.id === e.class_id ? ' selected' : '') + '>' + escapeHtml(c.name) + '</option>').join('') + '</select>' +
      '<label class="lbl" for="e-adm">Admission number</label><input id="e-adm" data-edit="admission_number" value="' + escapeHtml(e.admission_number || '') + '" placeholder="e.g. CFC/2026/0313" class="field mb-3.5">' +
      '<label class="lbl" for="e-phone">Parent phone</label><input id="e-phone" type="tel" data-edit="parent_phone" value="' + escapeHtml(e.parent_phone || '') + '" class="field">' +
      '<div class="flex gap-2.5 mt-5"><button type="button" data-action="s-save" class="flex-1 ' + btnPrimary + '"' + (state.ui.busy ? ' disabled' : '') + '>' + (state.ui.busy ? 'Saving…' : 'Save changes') + '</button><button type="button" data-action="s-close" class="' + btnGhost + '">Cancel</button></div>', 's-close');
  }
  return html + '<div class="flex flex-wrap gap-5 items-start">' + table + side + '</div>';
}
async function saveStudent() {
  const e = state.ui.s.edit;
  const adm = (e.admission_number || '').trim().toUpperCase();
  const patch = { class_id: e.class_id || null, admission_number: adm || null, parent_phone: (e.parent_phone || '').trim() || null, updated_at: new Date().toISOString() };
  state.ui.busy = true; render();
  const { error } = await sb.from('profiles').update(patch).eq('id', e.id);
  state.ui.busy = false;
  if (error) { render(); return toast(dbError(e.full_name + ' was not saved.', error), false); }
  toast(e.full_name + ' saved' + (patch.class_id ? ': ' + className(patch.class_id) : '') + '.', true);
  state.ui.s.edit = null; await loadAll(); render();
}

/* ---------- Teachers ---------- */
function viewTeachers() {
  const u = state.ui.t;
  const list = teachers();
  let html = pageHeader('Teachers', list.length + ' teacher' + (list.length === 1 ? '' : 's') + ' · assign the classes and subjects each one teaches');
  if (state.error) return html + errorBox();
  html += '<section class="' + card + ' p-4 lg:p-5 mb-3 lg:mb-5"><div class="flex flex-wrap justify-between items-start gap-2"><h2 class="font-display font-bold text-[17px] mb-1">Promote a user to teacher</h2><a href="#invites" class="text-sm font-semibold text-navy">Invite a new teacher by email →</a></div><p class="text-[13px] text-slate-600 mb-3">For someone who already has an account. Enter the email they signed up with.</p>' +
    '<div class="flex flex-col sm:flex-row gap-2.5"><input type="email" data-input="t-email" value="' + escapeHtml(u.email) + '" placeholder="teacher@example.com" aria-label="Email of the user to promote" class="field flex-1"><button type="button" data-action="t-promote" class="' + btnPrimary + ' inline-flex items-center justify-center gap-2"' + (state.ui.busy ? ' disabled' : '') + '>' + icon('promote', 18) + 'Make teacher</button></div></section>';
  let left = '<section class="flex flex-col gap-2.5 lg:flex-[999_1_480px] min-w-0">';
  if (!list.length) left += '<div class="' + card + ' px-6 py-10 text-center text-sm text-slate-600">No teachers yet. Promote a user above.</div>';
  left += list.map((t) => {

async function promoteTeacher() {
  const email = state.ui.t.email.trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('Enter the full email address the teacher signed up with.', false);

  if (!p) return toast('No account found for ' + email + '. Ask them to sign up first, then try again.', false);
  const role = roleOf(p.id);
  if (role === 'teacher') return toast(p.full_name + ' is already a teacher.', false);
  if (role === 'admin') return toast(p.full_name + ' is an admin. Change admins in the Supabase dashboard.', false);
  if (!confirm('Make ' + p.full_name + ' (' + email + ') a teacher? They will lose access to the student portal.')) return;
  state.ui.busy = true; render();

// Calls the invite-teacher Edge Function (runs on Supabase with the service key; admins only)
async function callInvite(action, payload) {
  const { data, error } = await sb.functions.invoke('invite-teacher', { body: { action, redirectTo: pageUrl('login.html'), ...(payload || {}) } });
  if (error) {
    let msg = error.message;
    try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch (_) {}
    return { error: msg };
  }
  if (data && data.error) return { error: data.error };
  return { data };
}

async function sendInvite() {
  const u = state.ui.i;
  const name = u.name.trim().replace(/\s+/g, ' '), email = u.email.trim().toLowerCase();
  if (name.length < 3) return toast("Enter the teacher's full name.", false);
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('Enter a valid email address.', false);
  if (u.cls && !u.subj.length) return toast('Choose at least one subject for ' + className(u.cls) + ', or set the class to "Assign later".', false);
  state.ui.busy = true; render();
  const r = await callInvite('invite', { email, full_name: name });
  if (r.error) { state.ui.busy = false; render(); return toast('Invite not sent. ' + r.error, false); }
  let note = '';
  if (u.cls) {
    const rows = u.subj.map((s) => ({ teacher_id: r.data.user_id, class_id: u.cls, subject_id: s }));
    const { error } = await sb.from('teacher_assignments').insert(rows);
    note = error ? ' But the class assignments were not saved. The database said: ' + error.message : ' Assigned to ' + className(u.cls) + '.';
  }
  state.ui.busy = false;
  toast('Invite sent to ' + email + '.' + note, !note.startsWith(' But'));
  state.ui.i = { name: '', email: '', cls: '', subj: [], list: null, loading: false, confirm: null };
  await loadAll(); render();
}
async function resendInvite(id) {
  const r = await callInvite('resend', { user_id: id });
  if (r.error) return toast('Invite not resent. ' + r.error, false);
  toast('Invite email sent again.', true);
}
async function cancelInvite(id) {
  const r = await callInvite('cancel', { user_id: id });
  state.ui.i.confirm = null;

  toast('Invite cancelled.', true);
  state.ui.i.list = null; await loadAll(); render();
}
async function removeTeacherRole(id) {
  const p = state.profiles.find((x) => x.id === id);

async function saveDue() {
  const u = state.ui.f, s = students().find((x) => x.id === u.sel);
  const amt = Math.round(Number(u.amount));
  if (u.amount === '' || isNaN(amt) || amt < 0) return toast('Enter an amount due of ₦0 or more.', false);
  state.ui.busy = true; render();
  const { error } = await sb.from('fees').upsert({ student_id: s.id, term: SCHOOL.currentTerm, session: SCHOOL.currentSession, amount_due: amt }, { onConflict: 'student_id,term,session' });
  state.ui.busy = false;
  if (error) { render(); return toast(dbError('Amount due was not saved.', error), false); }
  toast('Amount due for ' + s.full_name + ' set to ' + naira(amt) + '.', true);
  Object.assign(u, { sel: null, mode: null, amount: '' }); await loadAll(); render();
}
async function savePayment() {
  const u = state.ui.f, s = students().find((x) => x.id === u.sel), f = feeOf(s.id);
  const amt = Math.round(Number(u.amount)), bal = f.amount_due - f.amount_paid;
  if (!amt || amt <= 0) return toast('Enter a payment greater than ₦0.', false);
  if (amt > bal) return toast('That is more than the balance of ' + naira(bal) + '.', false);
  state.ui.busy = true; render();
  const r = await sb.from('fees').update({ amount_paid: f.amount_paid + amt, updated_at: new Date().toISOString() }).eq('id', f.id).select('amount_due, amount_paid');
  state.ui.busy = false;
  if (r.error || !r.data || !r.data.length) { render(); return toast(dbError('Payment was not saved.', r.error || { message: 'No fee row was updated.' }), false); }
  toast(naira(amt) + ' recorded for ' + s.full_name + '. New balance: ' + naira(r.data[0].amount_due - r.data[0].amount_paid) + '.', true);
  Object.assign(u, { sel: null, mode: null, amount: '' }); await loadAll(); render();
}
async function bulkDue() {
  const u = state.ui.f;
  const amt = Math.round(Number(u.bulk));
  if (u.bulk === '' || isNaN(amt) || amt < 0) return toast('Enter an amount due of ₦0 or more.', false);

  if (!studs.length) return toast('There are no students in ' + className(u.cls) + '.', false);

  const rows = studs.map((s) => ({ student_id: s.id, term: SCHOOL.currentTerm, session: SCHOOL.currentSession, amount_due: amt }));
  const { error } = await sb.from('fees').upsert(rows, { onConflict: 'student_id,term,session' });
  if (error) return toast(dbError('Amounts were not saved.', error), false);
  toast('Amount due set to ' + naira(amt) + ' for ' + studs.length + ' students in ' + className(u.cls) + '.', true);

const currentView = () => { const v = location.hash.replace('#', ''); return RENDER[v] ? v : 'dashboard'; };
function renderChrome(view) {

    return '<a href="#' + k + '"' + (on ? ' aria-current="page"' : '') + ' class="flex items-center gap-3 min-h-[44px] px-3 rounded-[10px] text-[15px] ' + (on ? 'bg-white/[0.14] text-white font-semibold' : 'text-slate-300 font-medium hover:bg-white/10 hover:text-white') + '">' + icon(k, 20, on ? 'style="color:#D4A017"' : '') + VIEWS[k].replace('&', '&amp;') + '</a>'; }).join('');

// Re-render while typing in a search box, keeping the cursor in place

  if (k === 'f-bulk') ui.f.bulk = t.value;
  if (k === 'n-title') ui.n.title = t.value;
  if (k === 'n-body') ui.n.body = t.value;
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  const k = e.target.dataset.input;
  if (k === 't-email') promoteTeacher();
  if (k === 'i-email' || k === 'i-name') sendInvite();
  if (k === 'newClass') csAdd('classes');
  if (k === 'newSubject') csAdd('subjects');
});
sb.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') window.location.replace('login.html'); });

(async function start() {
  mountCrests();
  const user = await requireRole('admin');
  if (!user) return;
  state.user = user;
  await loadAll();
  document.getElementById('boot').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  mountCrests();
  render();
})();
</script>
</body>
</html>
